        <h1 style="color: #0f172a; font-size: 24px;">مکتب خونه | سامانه هوشمند اشتراک‌گذاری و امانت کتاب مدارس</h1>
        <p><strong>مکتب‌خونه</strong> یک پلتفرم جامع برای اشتراک‌گذاری و امانت همتا به همتا (P2P) کتاب میان دانش‌آموزان با هدف ترویج فرهنگ کتابخوانی است.</p>
        <h2>بخش‌ها و قابلیت‌های اصلی:</h2>
        <ul>
          <li><strong>کتابخانه جامع و جستجو:</strong> جستجوی سریع بر اساس ژانر، رده سنی و پایه تحصیلی.</li>
          <li><strong>پروتکل ۱۲ ساعته امانت:</strong> امکان بررسی و تایید درخواست‌های امانت از منزل بدون نیاز به همراه داشتن گوشی در مدرسه.</li>
          <li><strong>لیگ کتابخوانی:</strong> جدول رده‌بندی برترین کتاب‌خوان‌ها و اهداکنندگان با نشان‌ها و مدال‌های طلا، نقره و برنز.</li>
          <li><strong>مشاور هوشمند Gemini:</strong> پیشنهاد کتاب متناسب با سن و علایق با هوش مصنوعی گوگل.</li>
          <li><strong>اتصال به پیام‌رسان بله:</strong> اطلاع‌رسانی خودکار پیام‌ها و رویدادها از طریق بات @Maktabkunebot.</li>
        </ul>
